name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

defaults:
  run:
    shell: sh

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine3.24
    steps:
      - name: Install system tools
        run: apk add --no-cache git ca-certificates tar
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: printf 'path=%s\n' "$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn
        uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-cache-dir.outputs.path }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - name: Setup Pages
        uses: actions/configure-pages@v6
        id: pages
      - name: Install dependencies
        run: yarn install --immutable
      - name: Guard local-only files
        run: test ! -f Jenkinsfile
      - name: Check
        run: yarn typecheck && yarn lint && yarn test
      - name: Build
        run: yarn build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
